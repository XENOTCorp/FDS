# h2o bench config — ceteris paribus with the other same-box servers.
# 4 threads, static root, no TLS (plaintext, matching the H1 benches).
listen:
  port: 8095
  host: 127.0.0.1
num-threads: 4
access-log: /dev/null
hosts:
  "127.0.0.1:8095":
    paths:
      "/":
        file.dir: /tmp/nginx-bench/root
