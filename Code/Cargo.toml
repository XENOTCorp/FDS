[workspace]
resolver = "2"
members = ["crates/mol", "crates/fds", "crates/fds-engine", "crates/fds-detect"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
license = "Apache-2.0"
authors = ["XENOT Corporation"]

# Release favors throughput over compile time. Tests still unwind even
# though production binaries abort on panic.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = false
debug-assertions = false
# Strip symbols to reduce the on-disk binary size.
strip = true

# Keep checks and debugging information during development; optimize
# dependencies separately to speed up repeated tests.
[profile.dev]
opt-level = 1
overflow-checks = true
debug-assertions = true

[profile.dev.package."*"]
opt-level = 3
