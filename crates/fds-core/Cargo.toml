[package]
name = "fds-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "FDS transport engine: nonblocking edge-triggered busy-polling TCP/UDP/SCTP dataplane on the Mol framework (Linux)."

# The engine is a binary package: no public API surface. All modules are
# crate-private (pub(crate)); the `fds` binary is the product.
[[bin]]
name = "fds"
path = "src/main.rs"

[dependencies]
mol-core = { path = "../mol-core" }
libc = "0.2"
rustix = { version = "1", features = ["net", "mm", "process", "event", "thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
static_assertions = "1.1"

[features]
# Everything on by default per the author's "everything now" milestone ruling.
# sctp: FFI declared in-crate; links libsctp (pkg-config `libsctp`).
# io-uring: experimental reactor path; links liburing via the io-uring crate.
# af-xdp: experimental raw-Ethernet path; pure libc constants, needs an
# XDP-attached device at runtime (tests skip when unavailable).
default = ["sctp", "io-uring", "af-xdp"]
sctp = []
io-uring = ["dep:io-uring"]
af-xdp = []

[dependencies.io-uring]
version = "0.7"
optional = true
