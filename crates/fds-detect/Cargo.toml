[package]
name = "fds-detect"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "FDS hardware detection + config tooling: prints a deterministic hardware summary, emits the repo-root config.json with D-1-derived defaults, generates config/config.schema.json, and validates config.json against the engine's config surface. No Python."

# A binary tool, not a library: there is no API surface beyond the CLI.
[[bin]]
name = "fds-detect"
path = "src/main.rs"

[dependencies]
# preserve_order: emit config.json/schema in the table's logical order
# (matching crates/fds-core/src/config.rs) instead of sorted key order.
serde_json = { version = "1", features = ["preserve_order"] }
