[workspace]
resolver = "2"
members = ["crates/mol-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"

# Release profile: silicon-level settings per the FDS build standard.
# opt-level 3, fat LTO, single codegen unit, abort on panic, overflow and
# debug assertions OFF in release, ON in dev.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = false
debug-assertions = false

[profile.dev]
overflow-checks = true
debug-assertions = true
